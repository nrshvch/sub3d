<!doctype html>
<html>
  <head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title></title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="module" src="main.js"></script>
    <style>
      * {
        padding: 0px;
        margin: 0px;
        border: 0px;

        touch-action: none;
        -webkit-user-select: none; /* Prevents text selection while panning */
        user-select: none;
      }

      html {
        height: 100%;
        overflow-y: scroll;
      }

      body {
        height: 100%;
      }

      #canvas {
        display: block;
        height: 100%;
        width: 100%;
        position: relative;
      }

      #debug {
        position: absolute;
        top: 60px;
        left: 10px;
        min-width: 196px;
        max-width: 320px;
        background: #ddd;
        padding: 8px;
        background: rgba(0, 0, 0, 0.6);
        color: #eeeeee;
        font-family: monospace;
        font-weight: 600;
        border-radius: 4px;
        font-size: 20px;

        @media (max-width: 768px) {
          font-size: 12px;
            min-width: 96px;
            max-width: 160px;
        }

        div {
          display: flex;
          gap: 16px;
          justify-content: space-between;
        }

          input[type="range"] {
              width: 100%;
          }
      }
      #toggle_debug_btn {
        position: fixed;
        top: 10px;
        left: 10px;
        padding: 8px 16px;
        background: rgba(0, 0, 0, 0.6);
        color: #eeeeee;
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 4px;
        font-family: monospace;
        font-weight: 600;
        font-size: 14px;
        cursor: pointer;
        z-index: 1000;
        backdrop-filter: blur(4px);
        transition: background 0.2s, border-color 0.2s;
      }
      #toggle_debug_btn:hover {
        background: rgba(0, 0, 0, 0.8);
        border-color: rgba(255, 255, 255, 0.4);
      }
      @media (max-width: 768px) {
        #toggle_debug_btn {
          font-size: 12px;
          padding: 6px 12px;
        }
      }
    </style>
  </head>
  <body>
    <button id="toggle_debug_btn">Open Debug</button>
    <canvas id="canvas"></canvas>

    <!-- Glassmorphic Premium Control Dock (Tailwind CSS styled) -->
    <div id="control-dock" class="fixed bottom-0 md:bottom-6 left-0 md:left-1/2 md:-translate-x-1/2 w-full md:w-auto flex flex-wrap md:flex-nowrap items-center justify-around md:justify-start gap-4 bg-slate-900/75 backdrop-blur-xl border-t border-white/10 md:border md:rounded-2xl px-5 py-3 shadow-2xl z-50 text-white font-sans text-xs select-none pointer-events-auto transition-all duration-300 hover:bg-slate-900/80 hover:border-white/20">
      <!-- Rotation Control -->
      <div class="flex flex-col items-center gap-1.5 w-24">
        <label for="dock_rotation" class="text-[9px] font-semibold tracking-wider text-slate-400 uppercase select-none">Rotate (<span id="dock_rot_val" class="font-bold text-white">45</span>°)</label>
        <input id="dock_rotation" type="range" min="0" max="360" value="45" class="w-full h-1 bg-white/20 rounded-lg appearance-none cursor-pointer accent-white hover:bg-white/30 transition-colors duration-150">
      </div>
      
      <div class="hidden md:block w-px h-8 bg-white/10"></div>
      
      <!-- Zoom Control -->
      <div class="flex flex-col items-center gap-1.5 w-24">
        <label for="dock_zoom" class="text-[9px] font-semibold tracking-wider text-slate-400 uppercase select-none">Zoom (<span id="dock_zoom_val" class="font-bold text-white">1.50</span>x)</label>
        <input id="dock_zoom" type="range" min="1" max="2" value="1.50" step="0.25" class="w-full h-1 bg-white/20 rounded-lg appearance-none cursor-pointer accent-white hover:bg-white/30 transition-colors duration-150">
      </div>
      
      <div class="hidden md:block w-px h-8 bg-white/10"></div>
 
      <!-- Current Position Indicator -->
      <div class="flex flex-col items-center min-w-[70px] leading-tight">
        <span class="text-[9px] font-semibold tracking-wider text-slate-400 uppercase select-none">Position</span>
        <span id="dock_coords_val" class="text-xs font-bold text-emerald-400 select-none">0.0, 0.0</span>
      </div>
 
      <div class="hidden md:block w-px h-8 bg-white/10"></div>
 
      <!-- Current Time Indicator -->
      <div class="flex flex-col items-center min-w-[50px] leading-tight">
        <span class="text-[9px] font-semibold tracking-wider text-slate-400 uppercase select-none">Time</span>
        <span id="dock_time_val" class="text-xs font-bold text-sky-400 select-none">12:00</span>
      </div>
 
      <!-- Cycle Speed Control -->
      <div class="flex flex-col items-center gap-1.5 w-24">
        <label for="dock_speed" class="text-[9px] font-semibold tracking-wider text-slate-400 uppercase select-none">Speed (<span id="dock_speed_val" class="font-bold text-white">1</span>x)</label>
        <input id="dock_speed" type="range" min="1" max="10" value="1" step="1" class="w-full h-1 bg-white/20 rounded-lg appearance-none cursor-pointer accent-white hover:bg-white/30 transition-colors duration-150">
      </div>
 
      <div class="hidden md:block w-px h-8 bg-white/10"></div>
 
      <!-- Smooth Shading Switch -->
      <div class="flex items-center gap-2">
        <label class="relative inline-flex items-center cursor-pointer select-none">
          <input id="dock_smooth" type="checkbox" class="sr-only peer">
          <div class="w-8 h-4 bg-white/20 rounded-full peer peer-focus:outline-none peer-checked:after:translate-x-full after:content-[''] after:absolute after:top-[2px] after:start-[2px] after:bg-white after:rounded-full after:h-3 after:w-3 after:transition-all peer-checked:bg-blue-500"></div>
        </label>
        <span class="text-[9px] font-semibold tracking-wider text-slate-400 uppercase select-none">Smooth Terrain</span>
      </div>
 
      <div class="hidden md:block w-px h-8 bg-white/10"></div>
 
      <!-- Auto Fly Switch -->
      <div class="flex items-center gap-2">
        <label class="relative inline-flex items-center cursor-pointer select-none">
          <input id="dock_fly" type="checkbox" class="sr-only peer">
          <div class="w-8 h-4 bg-white/20 rounded-full peer peer-focus:outline-none peer-checked:after:translate-x-full after:content-[''] after:absolute after:top-[2px] after:start-[2px] after:bg-white after:rounded-full after:h-3 after:w-3 after:transition-all peer-checked:bg-emerald-500"></div>
        </label>
        <span class="text-[9px] font-semibold tracking-wider text-slate-400 uppercase select-none">Fly</span>
      </div>
    </div>
 
    <!-- Technical Renderer Debug Menu (General items retained) -->
    <div id="debug" style="display: none;">
      <div>
        <label for="slider_scale">Scaling (<span id="scale_val">1.00</span>x)</label>
        <input id="slider_scale" type="range" min="0.25" max="4" value="1.0" step="0.25">
      </div>
      <div>
        <label for="slider_zoom">Zoom (<span id="zoom_val">1.50</span>x)</label>
        <input id="slider_zoom" type="range" min="1" max="2" value="1.50" step="0.25">
      </div>

      <div>
        <label for="slider_fog_near">Fog Near (<span id="fogNearValue">1500</span>)</label>
        <input id="slider_fog_near" type="range" min="0" max="5000" value="1500" step="50">
      </div>
      <div>
        <label for="slider_fog_far">Fog Far (<span id="fogFarValue">2500</span>)</label>
        <input id="slider_fog_far" type="range" min="0" max="5000" value="2500" step="50">
      </div>
      <div>
        <label for="slider_clip_near">Clip Near (<span id="clipNearValue">-2500</span>)</label>
        <input id="slider_clip_near" type="range" min="-5000" max="5000" value="-2500" step="50">
      </div>
      <div>
        <label for="slider_clip_far">Clip Far (<span id="clipFarValue">2500</span>)</label>
        <input id="slider_clip_far" type="range" min="0" max="10000" value="2500" step="50">
      </div>
      <div>
        <label for="color_sun">Sun Color</label>
        <input id="color_sun" type="color" value="#ffffff">
      </div>
      <div>
        <label for="color_fog">Fog Color</label>
        <input id="color_fog" type="color" value="#8cb4c8">
      </div>
      <div>
        <label for="color_ambient">Ambient Color</label>
        <input id="color_ambient" type="color" value="#202020">
      </div>
    </div>
  </body>
</html>
