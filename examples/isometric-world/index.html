<!doctype html>
<html>
  <head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title></title>
    <script type="module" src="main.js"></script>
    <style>
      * {
        padding: 0px;
        margin: 0px;
        border: 0px;

        touch-action: none;
        -webkit-user-select: none; /* Prevents text selection while panning */
        user-select: none;
      }

      html {
        height: 100%;
        overflow-y: scroll;
      }

      body {
        height: 100%;
      }

      #canvas {
        display: block;
        height: 100%;
        width: 100%;
        position: relative;
      }

      #debug {
        position: absolute;
        top: 60px;
        left: 10px;
        min-width: 196px;
        max-width: 320px;
        background: #ddd;
        padding: 8px;
        background: rgba(0, 0, 0, 0.6);
        color: #eeeeee;
        font-family: monospace;
        font-weight: 600;
        border-radius: 4px;
        font-size: 20px;

        @media (max-width: 768px) {
          font-size: 12px;
            min-width: 96px;
            max-width: 160px;
        }

        div {
          display: flex;
          gap: 16px;
          justify-content: space-between;
        }

          input[type="range"] {
              width: 100%;
          }
      }
      #toggle_debug_btn {
        position: fixed;
        top: 10px;
        left: 10px;
        padding: 8px 16px;
        background: rgba(0, 0, 0, 0.6);
        color: #eeeeee;
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 4px;
        font-family: monospace;
        font-weight: 600;
        font-size: 14px;
        cursor: pointer;
        z-index: 1000;
        backdrop-filter: blur(4px);
        transition: background 0.2s, border-color 0.2s;
      }
      #toggle_debug_btn:hover {
        background: rgba(0, 0, 0, 0.8);
        border-color: rgba(255, 255, 255, 0.4);
      }
      @media (max-width: 768px) {
        #toggle_debug_btn {
          font-size: 12px;
          padding: 6px 12px;
        }
      }
    </style>
  </head>
  <body>
    <button id="toggle_debug_btn">Open Debug</button>
    <canvas id="canvas"></canvas>
    <div id="debug" style="display: none;">
      <div>Max. FPS <span id="maxFps"></span></div>
      <div>FPS <span id="fps"></span></div>
      <div>Objects on scene <span id="objects"></span></div>
      <div>Objects on screen <span id="visibleObjects"></span></div>
      <div>Faces <span id="facesCount"></span></div>
      <div>Sorting Time <span><span id="sortTime"></span>ms<span></span></div>
      <div>Draw Calls <span id="drawCalls"></span></div>
      <div>System DPR <span id="system_dpr"></span></div>
      <div>
        <label for="slider_scale">Scaling (<span id="scale_val">1.00</span>x)</label>
        <input id="slider_scale" type="range" min="0.25" max="4" value="1.0" step="0.25">
      </div>
      <div>
        <label for="slider_zoom">Zoom (<span id="zoom_val">2.00</span>x)</label>
        <input id="slider_zoom" type="range" min="0.1" max="3" value="2.0" step="0.05">
      </div>
      <div>
        <label for="chkbx_1">Wireframe</label>
        <input id="chkbx_1" type="checkbox">
      </div>
      <div>
        <label for="chkbx_2">Smooth Terrain</label>
        <input id="chkbx_2" type="checkbox" checked="checked">
      </div>
      <div>
        <label for="chkbx_auto_cycle">Auto Day/Night</label>
        <input id="chkbx_auto_cycle" type="checkbox" checked="checked">
      </div>
      <div>
        <label for="slider_fog_near">Fog Near (<span id="fogNearValue">1500</span>)</label>
        <input id="slider_fog_near" type="range" min="0" max="5000" value="1500" step="50">
      </div>
      <div>
        <label for="slider_fog_far">Fog Far (<span id="fogFarValue">2500</span>)</label>
        <input id="slider_fog_far" type="range" min="0" max="5000" value="2500" step="50">
      </div>
      <div>
        <label for="slider_sun_angle">Sun Angle (<span id="sunAngleValue">0</span>°)</label>
        <input id="slider_sun_angle" type="range" min="0" max="360" value="0" step="1">
      </div>
      <div>
        <label for="color_sun">Sun Color</label>
        <input id="color_sun" type="color" value="#ffffff">
      </div>
      <div>
        <label for="color_fog">Fog Color</label>
        <input id="color_fog" type="color" value="#8cb4c8">
      </div>
      <div>
        <label for="color_ambient">Ambient Color</label>
        <input id="color_ambient" type="color" value="#202020">
      </div>
    </div>
  </body>
</html>
